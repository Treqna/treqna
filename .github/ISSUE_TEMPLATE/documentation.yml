name: Documentation Request
description: Report missing, unclear, or outdated documentation
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Help us keep Treqna documentation accurate and clear.
  - type: input
    id: doc_url
    attributes:
      label: Documentation Page
      description: URL or file path of the affected documentation page.
    validations:
      required: false
  - type: textarea
    id: issue_description
    attributes:
      label: Documentation Issue Description
      description: What is missing, unclear, or incorrect?
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed Documentation Update
      description: How should the documentation be updated?
    validations:
      required: false

